name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes

      - name: Syntax check
        run: |
          python -m py_compile main.py
          python -m py_compile main_window.py
          python -m py_compile detector.py
          python -m py_compile config.py
          python -m py_compile theme.py
          python -m py_compile i18n.py
          python -m py_compile screen_capture.py
          python -m py_compile launcher.py
          echo "All Python files compiled successfully"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: yolov5-visionhub:ci-test
